name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check audited catalog
        run: python3 scripts/build_catalog.py --check
      - name: Check generated README
        run: python3 scripts/generate_readme.py --check
      - name: Run tests
        run: python3 -m unittest discover -s tests
