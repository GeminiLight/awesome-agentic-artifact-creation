<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Artifact-family coverage over time</title>
  <desc id="chart-description">Stacked bars compare annual counts and shares for six artifact families.</desc>
  <style>
    :root { color-scheme: light dark; --background: #FCFBF8; --surface: #F4F3EF; --foreground: #26332E; --muted: #68756F; --grid: #DDE3DE; --frame: #C9D2CC; --heat: #2A9D8F; --family-0: #4E79A7; --family-1: #E15759; --family-2: #F2BE42; --family-3: #B07AA1; --family-4: #59A14F; --family-5: #2A9D8F; }
    @media (prefers-color-scheme: dark) { :root { --background: #18201E; --surface: #222C29; --foreground: #EDF2EF; --muted: #A9B5AF; --grid: #34413C; --frame: #4B5B55; --heat: #65C3B7; } }
    text { fill: var(--foreground); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 700; }
    .subtitle, .note, .axis, .legend { fill: var(--muted); }
    .subtitle { font-size: 15px; }
    .note, .axis, .legend { font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .value { font-size: 13px; font-weight: 700; }
    .segment-value { font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1; }
  </style>
