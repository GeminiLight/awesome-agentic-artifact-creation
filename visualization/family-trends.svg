<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Artifact-family paper counts over time</title>
  <desc id="chart-description">Stacked bars compare annual paper counts across six artifact families.</desc>
  <style>
    :root { color-scheme: light dark; --background: #FCFBF8; --surface: #F4F3EF; --foreground: #26332E; --muted: #68756F; --grid: #DDE3DE; --frame: #C9D2CC; --heat: #2A9D8F; --family-0: #3E6280; --family-1: #B95745; --family-2: #C98C27; --family-3: #247E7A; --family-4: #657A3C; --family-5: #745995;--family-text-0: #FFFFFF; --family-text-1: #FFFFFF; --family-text-2: #2A241A; --family-text-3: #FFFFFF; --family-text-4: #FFFFFF; --family-text-5: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --background: #18201E; --surface: #222C29; --foreground: #EDF2EF; --muted: #A9B5AF; --grid: #34413C; --frame: #4B5B55; --heat: #65C3B7; --family-0: #79A8D0; --family-1: #F08A78; --family-2: #F1C25B; --family-3: #5BC3BB; --family-4: #A8BD6F; --family-5: #AB8AC8;--family-text-0: #17201D; --family-text-1: #17201D; --family-text-2: #17201D; --family-text-3: #17201D; --family-text-4: #17201D; --family-text-5: #17201D; } }
    text { fill: var(--foreground); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 700; }
    .subtitle, .note, .axis, .legend { fill: var(--muted); }
    .subtitle { font-size: 15px; }
    .note, .axis, .legend { font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .value { font-size: 13px; font-weight: 700; }
    .segment-value { font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; }
    .bar-segment-value { font-size: 12px; font-weight: 700; letter-spacing: 0.01em; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1; }
  </style>
  <rect width="1200" height="590" rx="18" fill="var(--background)"/>
  <text class="title" x="54" y="46">Artifact-family paper counts over time</text>
  <text class="subtitle" x="54" y="73">Annual catalog coverage across the six artifact families</text>
