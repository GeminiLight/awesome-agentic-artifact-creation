  <title id="chart-title">Artifact taxonomy composition</title>
  <desc id="chart-description">A two-level donut chart shows artifact families in the inner ring and artifact types in the outer ring.</desc>
  <style>
    :root { color-scheme: light; --background: #FFFFFF; --surface: #F7F9FC; --foreground: #1F2A3D; --muted: #667085; --grid: #E2E8F0; --frame: #D5DDEA; --heat: #718DCA; --family-0: #4C9D96; --family-1: #66ADD0; --family-2: #718DCA; --family-3: #9380C1; --family-4: #B777A7; --family-5: #D89368;--family-text-0: #172033; --family-text-1: #172033; --family-text-2: #172033; --family-text-3: #172033; --family-text-4: #172033; --family-text-5: #172033; }
    text { fill: var(--foreground); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .title { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 700; }
    .subtitle, .note, .axis, .legend { fill: var(--muted); }
    .subtitle { font-size: 15px; }
    .note, .axis, .legend { font-size: 13px; }
    .label { font-size: 14px; font-weight: 600; }
    .value { font-size: 13px; font-weight: 700; }
    .center-total { font-size: 34px; font-weight: 700; }
    .center-label { fill: var(--muted); font-size: 13px; }
    .ring-count { font-size: 13px; font-weight: 700; pointer-events: none; }
    .segment-value { font-size: 12px; font-weight: 700; paint-order: stroke; stroke: var(--background); stroke-width: 3px; stroke-linejoin: round; }
    .bar-segment-value { font-size: 12px; font-weight: 700; letter-spacing: 0.01em; }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 1; }
  </style>
