<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">The agentic artifact construction process</title><desc id="desc">A task guides a construction policy, which edits a representation. Verification observes the result, returns feedback, and accepts a delivered artifact.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#718293"/></marker><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#172033" flood-opacity=".08"/></filter></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#172033}.caption{font-size:13px;fill:#526078}.heading{font-size:15px;font-weight:600}.label{font-size:11px;letter-spacing:2px;fill:#526078}</style><rect width="1200" height="500" rx="16" fill="#f8fafb"/><text x="600" y="54" text-anchor="middle" class="label">THE CONSTRUCTION PROCESS</text><g transform="translate(40 112)"><rect width="192" height="236" rx="14" fill="white" stroke="#dce4eb" filter="url(#shadow)"/><text x="18" y="28" class="label">01</text><rect x="56" y="51" width="80" height="80" rx="20" fill="#c86751" fill-opacity=".1"/><g fill="none" stroke="#c86751" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="76" y="66" width="40" height="50" rx="4"/><path d="M86 80h20M86 91h20M86 102h13"/></g><text x="96" y="164" text-anchor="middle" class="heading">Task specification</text><text x="96" y="191" text-anchor="middle" class="caption">Goal · constraints</text><text x="96" y="213" text-anchor="middle" class="caption">Acceptance criteria</text></g><path d="M239 222h25" stroke="#718293" stroke-width="1.6" marker-end="url(#arrow)"/><g transform="translate(272 112)"><rect width="192" height="236" rx="14" fill="white" stroke="#dce4eb" filter="url(#shadow)"/><text x="18" y="28" class="label">02</text><rect x="56" y="51" width="80" height="80" rx="20" fill="#8a70b4" fill-opacity=".1"/><g fill="none" stroke="#8a70b4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M77 78h38M77 78v30h38V78M96 78v15"/><circle cx="77" cy="78" r="5"/><circle cx="115" cy="78" r="5"/><circle cx="77" cy="108" r="5"/><circle cx="115" cy="108" r="5"/><circle cx="96" cy="96" r="5"/></g><text x="96" y="164" text-anchor="middle" class="heading">Construction policy</text><text x="96" y="191" text-anchor="middle" class="caption">Decision control</text><text x="96" y="213" text-anchor="middle" class="caption">Agent topology</text></g><path d="M471 222h25" stroke="#718293" stroke-width="1.6" marker-end="url(#arrow)"/><g transform="translate(504 112)"><rect width="192" height="236" rx="14" fill="white" stroke="#dce4eb" filter="url(#shadow)"/><text x="18" y="28" class="label">03</text><rect x="56" y="51" width="80" height="80" rx="20" fill="#4e8fba" fill-opacity=".1"/><g fill="none" stroke="#4e8fba" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m67 84 29-16 29 16-29 16Z M67 95l29 16 29-16M67 106l29 16 29-16"/></g><text x="96" y="164" text-anchor="middle" class="heading">Representation</text><text x="96" y="191" text-anchor="middle" class="caption">Intermediate form</text><text x="96" y="213" text-anchor="middle" class="caption">Edit interface</text></g><path d="M703 222h25" stroke="#718293" stroke-width="1.6" marker-end="url(#arrow)"/><g transform="translate(736 112)"><rect width="192" height="236" rx="14" fill="white" stroke="#dce4eb" filter="url(#shadow)"/><text x="18" y="28" class="label">04</text><rect x="56" y="51" width="80" height="80" rx="20" fill="#398f8d" fill-opacity=".1"/><g fill="none" stroke="#398f8d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="94" cy="88" r="21"/><path d="m108 104 14 14m-36-30 6 6 13-15"/></g><text x="96" y="164" text-anchor="middle" class="heading">Verification</text><text x="96" y="191" text-anchor="middle" class="caption">Observe · evaluate</text><text x="96" y="213" text-anchor="middle" class="caption">Actionable feedback</text></g><path d="M935 222h25" stroke="#718293" stroke-width="1.6" marker-end="url(#arrow)"/><g transform="translate(968 112)"><rect width="192" height="236" rx="14" fill="white" stroke="#dce4eb" filter="url(#shadow)"/><text x="18" y="28" class="label">05</text><rect x="56" y="51" width="80" height="80" rx="20" fill="#398f8d" fill-opacity=".1"/><g fill="none" stroke="#398f8d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m72 80 24-14 24 14v29l-24 14-24-14ZM72 80l24 14 24-14M96 94v29"/></g><text x="96" y="164" text-anchor="middle" class="heading">Delivered artifact</text><text x="96" y="191" text-anchor="middle" class="caption">Accepted output</text><text x="96" y="213" text-anchor="middle" class="caption">Reusable result</text></g><path d="M1064 365v44H136v-40" fill="none" stroke="#398f8d" stroke-width="2" marker-end="url(#arrow)"/><rect x="448" y="393" width="304" height="30" rx="15" fill="#f8fafb"/><text x="600" y="413" text-anchor="middle" class="caption">Feedback informs the next construction cycle</text></svg>